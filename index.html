
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>AIM HACK - KEY CENTER</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    position: relative;
    width: 100vw;
    height: 100dvh;
    max-width: 500px;

    background-image: url("https://i.postimg.cc/vmm2cBqz/31C9F15D-7AA1-4362-9E3D-8912709FE083.png");
    background-size: 100% 100%;
    background-position: center;
    background-repeat: no-repeat;
}

/* พื้นที่ปุ่มกด */
.click-area {
    position: absolute;
    display: block;
    left: 5%;
    width: 90%;
    height: 9%;

    background: transparent;
    border: none;
    outline: none;

    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    text-decoration: none;

    transition: transform 0.15s;
}

/* เอฟเฟกต์ตอนกด */
.click-area:active {
    transform: scale(0.97);
    background: rgba(255,255,255,0.10);
    border-radius: 15px;
}

/* 1. เปิดลิงก์ยืนยันคีย์ */
.btn-key {
    top: 50.7%;
}

/* 2. คลิปสอนการใช้งาน */
.btn-video {
    top: 61.7%;
}

/* 3. ซื้อคีย์ใช้งาน */
.btn-buy {
    top: 71.7%;
}

</style>
</head>

<body>

<div class="container">

    <!-- ปุ่มยืนยันคีย์ -->
    <a
        class="click-area btn-key"
        href="https://client.aimhack.shop/?__cf_chl_tk=fFa1Qaw6JEsgKVw_nW0deUa97hsavdYPlNJJ3hThh50-1794135072-1.0.1.1-P1.CW8RbdaIbKjfha4lZahc2yS5UuzpPFMDiImEjX.I"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="เปิดลิงก์ยืนยันคีย์">
    </a>

    <!-- ปุ่มคลิปสอน -->
    <a
        class="click-area btn-video"
        href="https://youtu.be/bjGJFJR932I?si=GE94_M8y8LMR_W0Q"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="คลิปสอนการใช้งาน">
    </a>

    <!-- ปุ่มซื้อคีย์ -->
    <a
        class="click-area btn-buy"
        href="https://vaiperxmod.vexzy.xyz"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="ซื้อคีย์ใช้งาน">
    </a>

</div>

</body>
</html>
