<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>AIM HACK - KEY CENTER</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    min-height: 100%;
    background: #000;
}

body {
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.container {
    position: relative;

    width: min(100vw, 55.77dvh);
    aspect-ratio: 928 / 1664;

    background-image: url("https://i.postimg.cc/D0zcN3Ft/po-s-te-xr-n-xxn-AIM-HACK-phr-xml-ngk-Android.png");

    background-size: 100% 100%;
    background-position: center;
    background-repeat: no-repeat;
}

/* พื้นที่ปุ่มกดทั้งหมด */
.click-area {
    position: absolute;
    display: block;

    left: 5%;
    width: 90%;
    height: 8%;

    background: transparent;
    border: none;
    outline: none;

    cursor: pointer;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;

    transition: transform 0.15s, background 0.15s;
}

/* เอฟเฟกต์ตอนกด */
.click-area:active {
    transform: scale(0.97);
    background: rgba(255,255,255,0.12);
    border-radius: 15px;
}

/* 1. ปุ่มสีแดง - ยืนยันคีย์ */
.btn-key {
    top: 49.4%;
}

/* 2. ปุ่มสีเงิน - คลิปสอน */
.btn-video {
    top: 58.2%;
}

/* 3. ปุ่มสีทอง - ซื้อคีย์ */
.btn-buy {
    top: 66.2%;
}

/* 4. ปุ่มสีเขียว - ดาวน์โหลด Android */
.btn-android {
    top: 74.3%;
}

</style>
</head>

<body>

<div class="container">

    <!-- 1. เปิดลิงก์ยืนยันคีย์ -->
    <a
        class="click-area btn-key"
        href="https://client.aimhack.shop/?__cf_chl_tk=fFa1Qaw6JEsgKVw_nW0deUa97hsavdYPlNJJ3hThh50-1794135072-1.0.1.1-P1.CW8RbdaIbKjfha4lZahc2yS5UuzpPFMDiImEjX.I"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="เปิดลิงก์ยืนยันคีย์">
    </a>

    <!-- 2. คลิปสอนการใช้งาน -->
    <a
        class="click-area btn-video"
        href="https://youtu.be/bjGJFJR932I?si=GE94_M8y8LMR_W0Q"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="คลิปสอนการใช้งาน">
    </a>

    <!-- 3. ซื้อคีย์ใช้งาน -->
    <a
        class="click-area btn-buy"
        href="https://vaiperxmod.vexzy.xyz"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="ซื้อคีย์ใช้งาน">
    </a>

    <!-- 4. ดาวน์โหลดแอพ Android -->
    <a
        class="click-area btn-android"
        href="https://www.mediafire.com/file/r4b9qa30tjzx8b6/Happ+Vpn+Phantom+Webmode"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="ดาวน์โหลดแอพ Android">
    </a>

</div>

</body>
</html>
